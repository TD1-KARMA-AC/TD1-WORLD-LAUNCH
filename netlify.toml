# TD1.WORLD — static site, no build step.
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

# One canonical address: https://www.td1.world
[[redirects]]
  from = "https://td1.world/*"
  to = "https://www.td1.world/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://td1.world/*"
  to = "https://www.td1.world/:splat"
  status = 301
  force = true

# Parked code and archived notes are kept in the repo but never served.
[[redirects]]
  from = "/_parked/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true

# Old pages people may have bookmarked
[[redirects]]
  from = "/karma-ac*"
  to = "/"
  status = 301

[[redirects]]
  from = "/ABOUT.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/PRODUCTS_INDEX.html"
  to = "/website/PRODUCTS_INDEX.html"
  status = 301

[[redirects]]
  from = "/neuroblock/*"
  to = "/Neuroblock/:splat"
  status = 301

# Realm is a single-page app
[[redirects]]
  from = "/realm/*"
  to = "/realm/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/world/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
