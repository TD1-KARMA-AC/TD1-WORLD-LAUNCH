<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TD1.WORLD</title>
  <meta name="description" content="A living 3D world of intelligence: where AI came from, what it is made of, and where it is going.">
  <meta name="theme-color" content="#04040a">
  <meta property="og:title" content="TD1.WORLD">
  <meta property="og:description" content="A living 3D world of intelligence. Spin it, fly in, explore.">
  <meta property="og:url" content="https://www.td1.world/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25'%3E%3Cstop offset='0' stop-color='%23C1A2FF'/%3E%3Cstop offset='1' stop-color='%23243a9e'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='26' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/world/style.css">
  <script type="importmap">
    { "imports": { "three": "/world/vendor/three.module.min.js", "three/addons/": "/world/vendor/" } }
  </script>
</head>
<body>
  <canvas id="world" aria-hidden="true"></canvas>
  <div id="labels" aria-label="Places on the world"></div>
  <div id="tip" role="status" aria-live="polite"></div>

  <header class="top">
    <a class="brand" href="/" aria-label="TD1.WORLD home"><span class="orb"></span>TD1<span>.WORLD</span></a>
    <nav><a href="/Neuroblock/">Marketplace</a></nav>
  </header>

  <div id="intro">
    <h1>A living world of intelligence.</h1>
    <p>Where AI came from, what it is made of, and where it is going. Every landmass is an idea.</p>
    <button id="begin" type="button">Start at the beginning</button>
    <p class="hint"><span class="d">Drag to spin · Scroll to zoom · Click a land to fly in</span><span class="m">Swipe to spin · Pinch to zoom · Tap a land</span></p>
  </div>

  <aside id="panel" aria-hidden="true" aria-label="Place details">
    <button id="panel-grip" type="button" aria-label="Expand or shrink"><span></span></button>
    <button id="panel-close" type="button" aria-label="Close">×</button>
    <div id="panel-body"></div>
  </aside>

  <nav id="dock" aria-label="Fly to"></nav>

  <div id="fallback"></div>
  <noscript><div class="noscript">TD1.WORLD is a 3D world and needs JavaScript. <a href="/Neuroblock/">Visit the marketplace</a> or <a href="/realm/">enter Realm</a>.</div></noscript>

  <script type="module" src="/world/app.js"></script>
  <script>
    // Retire the old site's service worker so returning visitors see the new world, not a cached page.
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  </script>
</body>
</html>
