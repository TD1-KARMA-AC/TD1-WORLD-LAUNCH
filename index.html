<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TD1.WORLD</title>
  <meta name="description" content="A living 3D world of intelligence: where AI came from, what it is made of, and where it is going.">
  <meta name="theme-color" content="#04040a">
  <meta property="og:title" content="TD1.WORLD">
  <meta property="og:description" content="A living 3D world of intelligence. Spin it, fly in, explore.">
  <meta property="og:url" content="https://www.td1.world/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2303040a'/%3E%3Cpath d='M25 10 L50 35 L75 10 L90 25 L65 50 L90 75 L75 90 L50 65 L25 90 L10 75 L35 50 L10 25 Z' fill='rgba(193,162,255,0.2)' stroke='%23C1A2FF' stroke-width='7' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/world/style.css">
  <script type="importmap">
    { "imports": { "three": "/world/vendor/three.module.min.js", "three/addons/": "/world/vendor/" } }
  </script>
</head>
<body>
  <canvas id="world" aria-hidden="true"></canvas>
  <div id="labels" aria-label="Places on the world"></div>
  <div id="tip" role="status" aria-live="polite"></div>

  <header class="top">
    <a class="brand" href="/" aria-label="TD1.WORLD home">
      <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M25 10 L50 35 L75 10 L90 25 L65 50 L90 75 L75 90 L50 65 L25 90 L10 75 L35 50 L10 25 Z" fill="rgba(193,162,255,0.16)" stroke="#C1A2FF" stroke-width="6" stroke-linejoin="round"/></svg>
      <b>TD1<span>.WORLD</span></b>
    </a>
    <nav><button type="button" id="nav-shop">Shop</button><button type="button" id="nav-contact">Contact</button><a href="/Neuroblock/" class="nav-market">Marketplace</a></nav>
  </header>

  <div id="intro">
    <p class="sys">// World online</p>
    <h1>A living world <em>of intelligence.</em></h1>
    <p>Where AI came from, what it is made of, and where it is going. Every landmass is an idea.</p>
    <button id="begin" type="button">Start at the beginning</button>
    <p class="hint"><span class="d">Drag to spin · Scroll to zoom · Click a land to fly in</span><span class="m">Swipe to spin · Pinch to zoom · Tap a land</span></p>
  </div>

  <div id="hud" aria-hidden="true">
    <div class="row"><span class="live">Live</span><span id="hud-sun">Day side</span></div>
    <div class="row"><span>Pos <b id="hud-pos">—</b></span></div>
    <div class="row opt"><span>Alt <b id="hud-alt">—</b></span><span>Over <b id="hud-over">—</b></span></div>
  </div>

  <aside id="panel" aria-hidden="true" aria-label="Place details">
    <button id="panel-grip" type="button" aria-label="Expand or shrink"><span></span></button>
    <button id="panel-close" type="button" aria-label="Close">×</button>
    <div id="panel-body"></div>
  </aside>

  <nav id="dock" aria-label="Fly to"></nav>

  <!-- Netlify reads this at deploy time so it can accept enquiries sent from The Beacon. -->
  <form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field"><input name="type"><input name="expertise"><input name="date"><input name="time">
    <input name="name"><input name="email"><input name="company"><input name="timezone"><textarea name="message"></textarea>
  </form>

  <div id="fallback"></div>
  <noscript><div class="noscript">TD1.WORLD is a 3D world and needs JavaScript. <a href="/Neuroblock/">Visit the marketplace</a> or <a href="/realm/">enter Realm</a>.</div></noscript>

  <script type="module" src="/world/app.js"></script>
  <script>
    // Retire the old site's service worker so returning visitors see the new world, not a cached page.
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  </script>
</body>
</html>
